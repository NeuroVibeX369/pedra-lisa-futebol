name: Importar Mukeka Retro

on:
  push:
    paths:
      - '.github/workflows/import-mukeka-retro.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  importar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar plataforma
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Baixar base autorizada
        run: |
          rm -rf /tmp/retro-soccer
          git clone --depth 1 https://github.com/Olegk77777/retro-soccer.git /tmp/retro-soccer

      - name: Copiar jogo para Mukeka Retro
        run: |
          rm -rf mukeka-retro
          mkdir -p mukeka-retro
          cp /tmp/retro-soccer/index.html mukeka-retro/
          cp -R /tmp/retro-soccer/audio mukeka-retro/
          cp -R /tmp/retro-soccer/data mukeka-retro/
          cp -R /tmp/retro-soccer/models mukeka-retro/
          cp -R /tmp/retro-soccer/src mukeka-retro/
          cp -R /tmp/retro-soccer/textures mukeka-retro/
          cp -R /tmp/retro-soccer/vendor mukeka-retro/

      - name: Personalizar Pedra Lisa e Independência
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path("mukeka-retro")
          home = root / "data/packs/retro-legends/teams/home.json"
          away = root / "data/packs/retro-legends/teams/away.json"
          pack = root / "data/packs/retro-legends/pack.json"

          h = json.loads(home.read_text(encoding="utf-8"))
          h["name"] = "PEDRA LISA"
          h["short"] = "PDL"
          h["colors"]["primary"] = "#178a3b"
          h["_comentario_mukeka"] = "Elenco personalizado da Mukeka Games."
          nomes = [
              ("OLAVO LOBÃO", 1, 180),
              ("NETO", 6, 160),
              ("DJHA", 3, 170),
              ("BASTIAOZÃO REI", 4, 180),
              ("BRUNO", 2, 165),
              ("LUCIANO", 10, 175),
              ("MANOEL", 5, 165),
              ("RONILTON", 8, 170),
              ("HÉLIO", 11, 170),
              ("BASTIAOZINHO", 9, 180),
              ("RICARDO", 7, 170),
          ]
          for p, (name, number, height) in zip(h["squad"], nomes):
              p["name"] = name
              p["number"] = number
              p["height"] = height
          home.write_text(json.dumps(h, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          a = json.loads(away.read_text(encoding="utf-8"))
          a["name"] = "INDEPENDÊNCIA"
          a["short"] = "IND"
          a["colors"]["primary"] = "#f2f2f2"
          a["_comentario_mukeka"] = "Elenco provisório do Independência; nomes podem ser trocados no catálogo."
          away_names = [
              ("GOLEIRO", 1), ("LATERAL ESQ.", 6), ("ZAGUEIRO 1", 3),
              ("ZAGUEIRO 2", 4), ("LATERAL DIR.", 2), ("MEIA 1", 8),
              ("VOLANTE", 5), ("MEIA 2", 10), ("PONTA", 11),
              ("ATACANTE 1", 9), ("ATACANTE 2", 7),
          ]
          for p, (name, number) in zip(a["squad"], away_names):
              p["name"] = name
              p["number"] = number
          away.write_text(json.dumps(a, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          p = json.loads(pack.read_text(encoding="utf-8"))
          p["title"] = "MUKEKA RETRO"
          p["venue"] = "ESTÁDIO PEDRA LISA"
          p["licensing"] = "authorized-custom"
          p["_licensing"] = "Versão Mukeka Games baseada em código usado com autorização do autor; conteúdo dos times personalizado."
          pack.write_text(json.dumps(p, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")

          index = root / "index.html"
          text = index.read_text(encoding="utf-8")
          text = text.replace("<title>Футбол 98</title>", "<title>Mukeka Retro</title>")
          text = text.replace("<title>Football 98</title>", "<title>Mukeka Retro</title>")
          if "</body>" in text:
              text = text.replace(
                  "</body>",
                  '<a href="/" style="position:fixed;left:14px;bottom:14px;z-index:99999;padding:9px 12px;background:#0b1b10;color:#dff5e3;border:1px solid #4b7757;text-decoration:none;font:700 11px system-ui;border-radius:8px">← MUKEKA GAMES</a>\n</body>'
              )
          index.write_text(text, encoding="utf-8")

          (root / "ORIGEM.md").write_text(
              "# Mukeka Retro\n\n"
              "Base técnica importada de Olegk77777/retro-soccer e personalizada para a Mukeka Games.\n"
              "A autorização de uso informada pelo responsável do projeto deve ser mantida arquivada pela Mukeka Games.\n",
              encoding="utf-8"
          )
          PY

      - name: Publicar importação no repositório
        run: |
          git config user.name "Mukeka Games Bot"
          git config user.email "actions@users.noreply.github.com"
          git add mukeka-retro
          if git diff --cached --quiet; then
            echo "Nenhuma alteração para publicar."
            exit 0
          fi
          git commit -m "Importa base autorizada do Mukeka Retro e personaliza os times"
          git push
