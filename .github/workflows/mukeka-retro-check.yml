name: Mukeka Retro check

on:
  push:
    branches: [main, mukeka-retro-dev]
    paths:
      - 'mukeka-retro/**'
      - '.github/workflows/mukeka-retro-check.yml'
  pull_request:
    paths:
      - 'mukeka-retro/**'
      - '.github/workflows/mukeka-retro-check.yml'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check mukeka-retro/src/netplay.js
          node --check mukeka-retro/src/online.js
          node --check mukeka-retro/src/pregame.js
          node --check mukeka-retro/src/master-league.js
          node --check mukeka-retro/src/commentator.js
          node --check mukeka-retro/src/main.js
          node --check mukeka-retro/src/match.js
          node --check mukeka-retro/src/scene.js
